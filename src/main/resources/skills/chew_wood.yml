# Jede Datei in skills/ kann mehrere zusammengehoerige Skills enthalten - genau wie
# bei MythicMobs' eigener skills.yml. Ein Mob ruft sie per "skill{s=<id>}" in seiner
# Skills:-Liste auf, mit Trigger-Suffix z.B. "~onTimer:40" oder "~onInteract".
nm_beaver_chew_parse:
  TargetConditions:
  - blocktype{type=BOOKSHELF,OAK_LOG,SPRUCE_LOG,BIRCH_LOG,JUNGLE_LOG,ACACIA_LOG,DARK_OAK_LOG,MANGROVE_LOG,CHERRY_LOG,OAK_WOOD,SPRUCE_WOOD,BIRCH_WOOD,JUNGLE_WOOD,ACACIA_WOOD,DARK_OAK_WOOD,MANGROVE_WOOD,CHERRY_WOOD,OAK_FENCE,SPRUCE_FENCE,BIRCH_FENCE,JUNGLE_FENCE,ACACIA_FENCE,DARK_OAK_FENCE,MANGROVE_FENCE,CHERRY_FENCE,OAK_DOOR,SPRUCE_DOOR,BIRCH_DOOR,JUNGLE_DOOR,ACACIA_DOOR,DARK_OAK_DOOR,MANGROVE_DOOR,CHERRY_DOOR,OAK_GATE,SPRUCE_GATE,BIRCH_GATE,JUNGLE_GATE,ACACIA_GATE,DARK_OAK_GATE,MANGROVE_GATE,CHERRY_GATE,OAK_STAIRS,SPRUCE_STAIRS,BIRCH_STAIRS,JUNGLE_STAIRS,ACACIA_STAIRS,DARK_OAK_STAIRS,MANGROVE_STAIRS,CHERRY_STAIRS,OAK_SLAB,SPRUCE_SLAB,BIRCH_SLAB,JUNGLE_SLAB,ACACIA_SLAB,DARK_OAK_SLAB,MANGROVE_SLAB,CHERRY_SLAB}
  Skills:
  - CancelEvent
  - skill{s=nm_beaver_chew_activate}

nm_beaver_chew_activate:
  Skills:
  - look{immediately=true} @ObstructingBlock
  - sound{s=entity.rabbit.ambient;p=0.4;v=1} @self
  - state{state=chew;n=false;speed=1;li=1;lo=1} @self
  - potion{type=SLOW;duration=31;level=19} @self
  - delay 8
  - sound{s=block.wooden_button.click_on;p=1.3;v=2} @self
  - delay 4
  - sound{s=block.wooden_button.click_on;p=1.3;v=2} @self
  - delay 4
  - sound{s=block.wooden_button.click_on;p=1.3;v=2} @self
  - delay 4
  - sound{s=block.wooden_button.click_on;p=1.3;v=2} @self
  - delay 4
  - sound{s=block.wooden_button.click_on;p=1.3;v=2} @self
  - breakblock{useTool=false} @ObstructingBlock
