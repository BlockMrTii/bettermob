name: BetterMob
version: '1.1.4'
main: eu.northsoft.bettermob.BetterMobPlugin
api-version: '1.21'
folia-supported: true
authors: [northsoft, HyperGaming99]
description: Registriert eigene Mobs in einer Datei und rendert sie ueber BetterModel oder ModelEngine.
softdepend: [BetterModel, ModelEngine]
commands:
  bettermob:
    description: Verwaltet BetterMob
    usage: /bettermob help
    aliases: [bmob]
    permission: bettermob.admin
permissions:
  bettermob.admin:
    description: Erlaubt das Spawnen und Verwalten von BetterMob-Mobs
    default: op
