# Namen von Unterordnern in packs/, die beim Laden uebersprungen werden sollen.
DisabledPacks: []

# Spieler in eine Faction aufnehmen: Mobs dieser Faction greifen sie nicht an (und umgekehrt).
# Alternativ die Permission bettermob.faction.<name> vergeben (Name klein geschrieben).
# Beispiel:
# factions:
#   elite:
#     - PlayerName
#     - 123e4567-e89b-12d3-a456-426614174000
factions: {}

# Debug-Ausgabe: off, info (Trigger, Skills, KI) oder verbose (zusaetzlich jede Mechanik, Bones, Projektile).
# Zur Laufzeit mit /bettermob debug <off|info|verbose>.
Debug: off

# Language of console and command messages: the name of a file in lang/ without .yml (en, de).
# Add your own lang/<code>.yml to translate; missing keys fall back to English.
Language: en

# Skill profiling for /bettermob stats: off or on. Costs nothing while off.
Stats: off

# With profiling on, warn in the console when one skill run takes longer than this many milliseconds (0 = never).
StatsWarnMillis: 50
