name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github

      - name: Build
        run: mvn -B clean package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bettermob-jar
          path: target/bettermob-*.jar

      # Neue Version = <version> in der pom.xml hochzaehlen und auf main pushen; gibt es
      # den Tag v<version> noch nicht, wird er samt Release und Maven-Paket angelegt.
      - name: Check for new version
        id: version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: target/bettermob-*.jar
          generate_release_notes: true

      - name: Publish to GitHub Packages
        if: steps.version.outputs.release == 'true'
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
