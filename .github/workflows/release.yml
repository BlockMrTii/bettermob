name: Build and Release

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github

      - name: List commits since the last release
        if: github.event_name != 'pull_request'
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          range=${last:+$last..HEAD}
          {
            echo "## Commits${last:+ since $last}"
            echo
            git log $range --pretty=format:"- %s ([\`%h\`](https://github.com/${{ github.repository }}/commit/%H))"
            echo
          } > "$RUNNER_TEMP/commits.md"
          
      - name: Test
        run: mvn -B test

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bettermob-jar
          path: target/bettermob-*.jar

      - name: Build the API example
        run: |
          mvn -B install -DskipTests
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          mvn -B -f examples/api-example/pom.xml -Plocal -Dbettermob.version="$version" package

      - name: Check for new version
        id: version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: target/bettermob-*.jar
          body_path: ${{ runner.temp }}/commits.md
          generate_release_notes: true

      - name: Publish to GitHub Packages
        if: steps.version.outputs.release == 'true'
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish rolling dev release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          sha=$(git rev-parse --short HEAD)
          asset="bettermob-${version}-dev-${sha}.jar"
          cp "target/bettermob-${version}.jar" "$asset"
          gh release delete dev-build --cleanup-tag --yes || true
          gh release create dev-build "$asset" --prerelease --target "$GITHUB_SHA" \
            --title "Dev build" \
            --notes "$(printf 'Automatic build of the `dev` branch at commit %s. Unstable, may contain unfinished features. This release is replaced on every push to dev.\n\n' "$sha"; cat "$RUNNER_TEMP/commits.md")"
