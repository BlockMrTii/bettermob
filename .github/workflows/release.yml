name: Build and Release

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

# Pro Branch hoechstens ein Lauf gleichzeitig: sonst koennten zwei schnelle Pushes auf dev
# sich beim Loeschen und Neuanlegen des Dev-Releases ins Gehege kommen.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github

      - name: Build
        run: mvn -B clean package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bettermob-jar
          path: target/bettermob-*.jar

      # Neue Version = <version> in der pom.xml hochzaehlen und auf main pushen; gibt es
      # den Tag v<version> noch nicht, wird er samt Release und Maven-Paket angelegt.
      - name: Check for new version
        id: version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: target/bettermob-*.jar
          generate_release_notes: true

      - name: Publish to GitHub Packages
        if: steps.version.outputs.release == 'true'
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Auf dev gibt es immer genau einen Pre-Release "dev", der bei jedem Push durch den
      # neuesten Build ersetzt wird (Tag und Release werden geloescht und neu angelegt).
      - name: Publish rolling dev release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          sha=$(git rev-parse --short HEAD)
          asset="bettermob-${version}-dev-${sha}.jar"
          cp "target/bettermob-${version}.jar" "$asset"
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev "$asset" --prerelease --target "$GITHUB_SHA" \
            --title "Dev build" \
            --notes "Automatic build of the \`dev\` branch at commit ${sha}. Unstable, may contain unfinished features. This release is replaced on every push to dev."
